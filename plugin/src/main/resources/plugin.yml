name: EnchantedMobs
version: '${project.version}'
main: cn.superiormc.enchantedmobs.EnchantedMobs
api-version: '1.21.2'
folia-supported: true
author: PQguanfang
softdepend:
  # Item
  - MMOItems
  - ItemsAdder
  - Oraxen
  - Nexo
  - EcoItems
  - EcoArmor
  - MythicMobs
  - ExecutableItems
  - CraftEngine
  - NeigeItems
  - eco
  # Others
  - PlaceholderAPI
  - MythicChanger
  - NBTAPI
  - LevelledMobs
  - packetevents
commands:
  enchantedmobs:
    aliases:
      - "emobs"
      - "em"
    usage: "/enchantedmobs"
    description: "EnchantedMobs Main Command."
permissions:
  enchantedmobs.nodify:
    description: Receive powered mob spawn notifications
    default: false
